<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Таймер сна">
    <meta name="theme-color" content="#007aff">
    <title>Таймер сна — высыпайся легко</title>
    
    <link rel="apple-touch-icon" href="sleep-icon.png">
    <link rel="icon" type="image/png" href="sleep-icon.png">
    <link rel="manifest" href="manifest-sleep.json">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #f5f5f7;
            color: #1c1c1e;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            padding: calc(env(safe-area-inset-top, 20px) + 10px) 16px 40px 16px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            margin-top: 8px;
        }
        .header-icon {
            width: 60px;
            height: 60px;
            background: rgba(0, 122, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .header-text h1 { font-size: 28px; font-weight: 700; }
        .header-text p { font-size: 14px; color: #6c6c70; }
        
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04), 0 0 0 0.5px rgba(0,0,0,0.02);
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .time-display {
            background: #f5f5f7;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }
        .time-display .label {
            font-size: 14px;
            color: #6c6c70;
            margin-bottom: 8px;
        }
        .time-display .time {
            font-size: 48px;
            font-weight: 700;
            color: #007aff;
            letter-spacing: -1px;
        }
        
        button {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.15s ease;
        }
        button:active { transform: scale(0.97); background: #005fc1; }
        
        .cycle-info {
            background: #f5f5f7;
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
        }
        .cycle-info p {
            font-size: 14px;
            color: #6c6c70;
            line-height: 1.5;
        }
        
        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .mode-btn {
            flex: 1;
            background: #f5f5f7;
            color: #1c1c1e;
            margin-top: 0;
        }
        .mode-btn.active {
            background: #007aff;
            color: white;
        }
        .mode-btn:active { transform: scale(0.97); }
        
        .result-list {
            margin-top: 16px;
        }
        .result-item {
            background: #f5f5f7;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-item .cycles {
            font-size: 14px;
            color: #6c6c70;
        }
        .result-item .time {
            font-size: 18px;
            font-weight: 600;
            color: #007aff;
        }
        
        .note {
            font-size: 12px;
            color: #8e8e93;
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 0.5px solid #e9e9ef;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-icon">
        😴
    </div>
    <div class="header-text">
        <h1>Таймер сна</h1>
        <p>Просыпайся бодрым</p>
    </div>
</div>

<div class="card">
    <div class="section-title">⏰ Когда мне</div>
    
    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('wake')">Проснуться</button>
        <button class="mode-btn" onclick="setMode('sleep')">Лечь спать</button>
    </div>
    
    <div class="time-display" id="inputDisplay">
        <div class="label" id="inputLabel">Я хочу проснуться в</div>
        <input type="time" id="targetTime" value="07:00" style="font-size: 48px; font-weight: 700; text-align: center; background: transparent; border: none; color: #007aff; padding: 0; margin: 0;">
    </div>
    
    <button onclick="calculate()">Рассчитать</button>
    
    <div class="cycle-info">
        <p>💤 1 цикл сна = 90 минут. Пробуждение между циклами помогает проснуться бодрым.</p>
    </div>
</div>

<div class="card" id="results" style="display: none;">
    <div class="section-title">📋 Рекомендации</div>
    <div id="resultList"></div>
    <div class="note" id="noteText"></div>
</div>

<script>
    let currentMode = 'wake'; // 'wake' или 'sleep'
    
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'wake') {
            document.querySelector('.mode-btn:first-child').classList.add('active');
            document.getElementById('inputLabel').textContent = 'Я хочу проснуться в';
        } else {
            document.querySelector('.mode-btn:last-child').classList.add('active');
            document.getElementById('inputLabel').textContent = 'Я ложусь спать в';
        }
        document.getElementById('results').style.display = 'none';
    }
    
    function calculate() {
        let targetTimeStr = document.getElementById('targetTime').value;
        let [hours, minutes] = targetTimeStr.split(':').map(Number);
        
        let now = new Date();
        let target = new Date();
        target.setHours(hours, minutes, 0, 0);
        
        // Если время уже прошло сегодня — переносим на завтра
        if (target <= now) {
            target.setDate(target.getDate() + 1);
        }
        
        let cycleMinutes = 90;
        let fallAsleepTime = 15; // 15 минут на засыпание
        
        let results = [];
        
        if (currentMode === 'wake') {
            // Режим: хочу проснуться в X — показываю когда лечь
            for (let cycles = 3; cycles <= 6; cycles++) {
                let sleepMinutes = cycles * cycleMinutes + fallAsleepTime;
                let bedTime = new Date(target.getTime() - sleepMinutes * 60000);
                results.push({
                    cycles: cycles,
                    time: bedTime
                });
            }
            document.getElementById('noteText').innerHTML = '⭐ Ложись в одно из этих времён, чтобы проснуться между циклами сна.';
        } else {
            // Режим: ложусь в X — показываю когда проснусь
            let bedTime = target;
            for (let cycles = 3; cycles <= 6; cycles++) {
                let sleepMinutes = cycles * cycleMinutes + fallAsleepTime;
                let wakeTime = new Date(bedTime.getTime() + sleepMinutes * 60000);
                results.push({
                    cycles: cycles,
                    time: wakeTime
                });
            }
            document.getElementById('noteText').innerHTML = '⭐ Проснись в одно из этих времён, чтобы выспаться.';
        }
        
        let html = '<div class="result-list">';
        for (let r of results) {
            let hoursTime = r.time.getHours().toString().padStart(2, '0');
            let minutesTime = r.time.getMinutes().toString().padStart(2, '0');
            html += `
                <div class="result-item">
                    <span class="cycles">${r.cycles} цикла сна (${r.cycles * 90} мин)</span>
                    <span class="time">${hoursTime}:${minutesTime}</span>
                </div>
            `;
        }
        html += '</div>';
        
        document.getElementById('resultList').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }
    
    // Установка текущего времени по умолчанию
    let defaultTime = new Date();
    defaultTime.setHours(7, 0, 0, 0);
    document.getElementById('targetTime').value = '07:00';
</script>
</body>
</html>
